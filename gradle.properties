org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Penyesuaian untuk AGP 9 ------------------------------------------------
# AGP 9 mengubah dua hal secara default, dan keduanya belum cocok dengan
# susunan modul proyek ini:
#
#   android.newDsl       Mengganti tipe DSL lama dengan yang baru. Plugin
#                        org.jetbrains.kotlin.android tidak kompatibel dengan
#                        DSL baru tersebut.
#   android.builtInKotlin AGP mengompilasi berkas Kotlin sendiri, sehingga
#                        plugin KGP dan blok "kotlin { }" tidak lagi berperan.
#                        Proyek ini masih memakai KGP secara eksplisit.
#
# Keduanya dimatikan agar perilaku build tetap sama seperti AGP 8.x. Opsi ini
# dihapus pada AGP 10, jadi ini utang teknis yang harus dilunasi sebelum itu.
android.newDsl=false
android.builtInKotlin=false

# Compose UI 1.12.1 dan core-ktx 1.19.1 mensyaratkan compileSdk 37,
# dan AGP 9.4 sudah mendukung API 37 tanpa perlu dibungkam.

kotlin.code.style=official
