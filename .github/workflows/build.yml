name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Satu job, dua tahap: unit test inti lebih dulu, lalu APK.
  #
  # Keduanya sengaja digabung karena Gradle tetap mengonfigurasi semua modul
  # walau hanya tugas JVM yang diminta. Artinya modul Android (dan karena itu
  # Android SDK) sudah dibutuhkan sejak tahap test, sehingga memisahkannya jadi
  # dua job hanya menambah satu penyiapan SDK yang tidak perlu.
  #
  # Urutan tahap tetap menjadi gerbang: APK tidak akan dibangun kalau salah satu
  # unit test gagal, karena langkah test menghentikan job lebih dahulu.
  build:
    name: Unit test + APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      # Android 17 memakai penomoran versi minor: paket platformnya bernama
      # "android-37.0", bukan "android-37". Nama itulah yang dicari AGP saat
      # compileSdk = 37 dipakai. Build-tools 36.0.0 adalah versi minimum AGP 9.4.
      - name: Pasang platform dan build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      # Logika inti (pembaca GLB, sampler animasi, matematika kuaternion) tidak
      # menyentuh API Android sama sekali, jadi diuji di JVM biasa. Bagian inilah
      # yang paling sering berisi kesalahan, dan pesannya jauh lebih jelas di sini
      # daripada kalau harus muncul sebagai crash di perangkat.
      - name: Unit test inti
        run: ./gradlew :core:anim:test :core:gltf:test --stacktrace

      - name: Unggah laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
